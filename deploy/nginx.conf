# /etc/nginx/sites-available/hr-media-score
# Sustituya score.example.com por el dominio real. HTTPS con Let's Encrypt (certbot --nginx).
server {
    listen 80;
    listen [::]:80;
    server_name score.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name score.example.com;
    root /var/www/hr-media-score/current/public;
    index index.php;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/score.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/score.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 8M;   # logos y fotos (la app limita a 4 MB)

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Recursos con hash de Vite y marca: caché larga
    location ~* ^/(build|assets)/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location ^~ /storage/ { expires 30d; access_log off; }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Nunca servir archivos ocultos (.env, .git) ni PHP subido a storage
    location ~ /\.(?!well-known).* { deny all; }
    location ~* ^/storage/.*\.php$ { deny all; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
}
